apply plugin: "java"

sourceSets.main.java.srcDirs = ["src"]

repositories {
    mavenCentral()
    ivy {
        url = "https://github.com/"
        patternLayout { artifact "/[organisation]/[module]/releases/download/[revision]/dependencies.jar" }
        metadataSources { artifact() }
    }
}

java {
    targetCompatibility = JavaVersion.VERSION_17
    sourceCompatibility = JavaVersion.VERSION_17
}

// The panel speaks French, and the sources hold its accents directly. Without this the
// compiler reads them in the platform encoding and the game shows "RÃ©parer".
tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

ext {
    // Must match the client this mod is installed into. The game's own classes are the
    // only API here, and they move between versions without warning.
    mindustryVersion = "v159.7"
}

dependencies {
    compileOnly "Anuken:Mindustry:$mindustryVersion"
}

jar {
    archiveFileName = "mindustry-warden.jar"
    from(rootDir) { include "mod.hjson" }
}
